<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon — orange PNG, 180×180 covers desktop + iOS home screen -->
    <link rel="icon" type="image/png" href="/favicon-orange.png" />
    <link rel="apple-touch-icon" href="/favicon-orange.png" />

    <title>VIVID — Sparkling Boost</title>
    <meta
      name="description"
      content="Cinematic landing page for VIVID, a functional sparkling drink. Scroll-driven 3D, infinite loop, and a soundtrack — designed and built at SONI Labs."
    />

    <!-- Open Graph — LinkedIn / Facebook / Slack / iMessage previews. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://3d-landing-brown.vercel.app/" />
    <meta property="og:title" content="VIVID — Sparkling Boost" />
    <meta
      property="og:description"
      content="Cinematic landing page for VIVID, a functional sparkling drink. Scroll-driven 3D, infinite loop, and a soundtrack — designed and built at SONI Labs."
    />
    <meta property="og:image" content="https://3d-landing-brown.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter / X large-card preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VIVID — Sparkling Boost" />
    <meta
      name="twitter:description"
      content="Cinematic landing page for VIVID, a functional sparkling drink. Scroll-driven 3D, infinite loop, and a soundtrack — designed and built at SONI Labs."
    />
    <meta name="twitter:image" content="https://3d-landing-brown.vercel.app/og-image.png" />
